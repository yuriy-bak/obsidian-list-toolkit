name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened
      description: A few words are enough. If you can, add the list as Markdown (a few lines) and what you did with it. English or Russian.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Plugin version (optional)
      description: Settings → Community plugins, under the plugin name.
      # Generated from versions.json by `npm run issue-form:versions`; CI checks it.
      # versions:start
      options:
        - "Beta (BRAT)"
        - "Older"
      # versions:end
  - type: dropdown
    attributes:
      label: Device (optional)
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPadOS
  - type: input
    attributes:
      label: Obsidian version (optional)
      description: Settings → General → Current version.
      placeholder: "1.13.2"
  - type: input
    attributes:
      label: Other list plugins (optional)
      description: For example Outliner, if it is enabled.
